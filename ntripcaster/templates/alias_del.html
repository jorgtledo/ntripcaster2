<!DOCTYPE html>
<html>
  <head>
    <title>NtripCaster — Delete Alias</title>
@INCLUDE style.html@
  </head>
  <body>
    <nav class="navbar">
      <a href="/admin" class="navbar-brand">
        <div class="logo">NC</div>
        <div>
          <div class="brand-text">Delete Alias</div>
          <div class="brand-sub">NtripCaster Admin</div>
        </div>
      </a>
    </nav>
    <div class="page-wrapper">
      <div class="card form-card">
        <div class="card-header">
          <h3>Delete Mountpoint Alias</h3>
        </div>
        <form action="/admin" method="get">
          <input type="hidden" name="mode" value="alias">
          <input type="hidden" name="argument" value="del">
          <label>Alias Name</label>
          <input type="text" name="argument1" placeholder="e.g. /myalias" required>
          <button type="submit" class="btn btn-danger">Delete Alias</button>
        </form>
      </div>
      <a href="/admin" class="back-link">&larr; Back to Dashboard</a>
    </div>
  </body>
</html>
